<!DOCTYPE html>
<html>
<head>
    <title>Weather App</title>
</head>
<body>

<h1>Weather Checker</h1>

<form method="POST">
    <input type="text" name="city" placeholder="Enter city">
    <button type="submit">Check Weather</button>
</form>

{% if weather %}
<h2>{{ weather.city }}</h2>
<p>Temperature: {{ weather.temp }}°C</p>
<p>Condition: {{ weather.desc }}</p>
{% endif %}

</body>
</html>
